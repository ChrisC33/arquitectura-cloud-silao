<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arquitectura Cloud 360° · Caso Planta Nestlé Purina Silao</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #F8FAFC; color: #0F172A; font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [mainTab, setMainTab] = useState("dual");
      const [mobileTab, setMobileTab] = useState("ticket");
      const [offlineMode, setOfflineMode] = useState(false);
      const [offlineQueue, setOfflineQueue] = useState([]);
      const [vaultFlash, setVaultFlash] = useState(false);
      const [showVaultModal, setShowVaultModal] = useState(false);

      const [silaoAdvance, setSilaoAdvance] = useState(18);
      const [silaoSpentPct, setSilaoSpentPct] = useState(16.5);
      const [closedTickets, setClosedTickets] = useState(14);
      const [openReqs, setOpenReqs] = useState([
        { id: "REQ-904", obra: "Planta Nestlé Purina Silao · Nave Proceso", item: "Acero Estructural A-36 (18 Ton)", monto: 468000, solicitante: "Ing. Residente Silao", status: "Pendiente" },
        { id: "REQ-905", obra: "Planta Nestlé Purina Silao · Subestación", item: "Charola Portacable Aluminio 24\"", monto: 84500, solicitante: "Sup. Electromecánico", status: "Pendiente" }
      ]);
      const [feedLogs, setFeedLogs] = useState([
        { time: "Hace 8 min", type: "GPS", text: "Check-in Asistencia (24 técnicos IMSS/DC-3 OK) — Caseta Norte Nestlé Purina Silao (20.9961° N, 101.4862° W)" },
        { time: "Hace 22 min", type: "CAD", text: "Plano Estructural E-104 Rev.3 sincronizado en modo Solo Lectura para tabletas en Silao" },
        { time: "Hace 45 min", type: "BACKUP", text: "Respaldo Inmutable 3-2-1 completado: 1.42 TB encriptados (Estaciones AutoCAD + Servidor Opus)" }
      ]);

      const [selectedSite, setSelectedSite] = useState("Planta Nestlé Purina Silao · Cimentación Nave Principal");
      const [signedBy, setSignedBy] = useState("Ing. Supervisor EHS / Control de Calidad Silao");
      const [signatureDone, setSignatureDone] = useState(true);
      const [reqMaterial, setReqMaterial] = useState("Concreto Premezclado f'c=350 kg/cm² (42 m³)");
      const [reqCost, setReqCost] = useState("136500");
      const [qrTool, setQrTool] = useState("Estación Total Leica TS07 #QR-019");
      const [workerCheck, setWorkerCheck] = useState("Cuadrilla Montaje Estructural (12 personas · SUA/DC-3 Vigente)");

      const [roleView, setRoleView] = useState("Director");

      const [empresaNombre, setEmpresaNombre] = useState("");
      const [contactoNombre, setContactoNombre] = useState("");
      const [empOficina, setEmpOficina] = useState(8);
      const [empResidentes, setEmpResidentes] = useState(6);
      const [empCampo, setEmpCampo] = useState(35);
      const [pcOficina, setPcOficina] = useState(6);
      const [pcCad, setPcCad] = useState(4);
      const [pcPortatiles, setPcPortatiles] = useState(5);
      const [accionComputo, setAccionComputo] = useState(["Actualizar equipos lentos (SSD/RAM)", "Adquirir equipos nuevos para proyecto Silao"]);
      const [licenciasReq, setLicenciasReq] = useState(["Windows Pro", "Microsoft 365 / Google Workspace", "AutoCAD / BIM", "Opus / CONTPAQi en Nube", "Antivirus Empresarial"]);
      const [respaldosLocales, setRespaldosLocales] = useState(["Carpetas Mis Documentos / Escritorio de cada PC", "Correos históricos (.PST Outlook)", "Bases de datos Opus / Neodata / Contabilidad", "Respaldo diario automático sin intervención"]);
      const [checadorActual, setChecadorActual] = useState(["Listas en papel / Excel por residente", "Mensajes por grupos de WhatsApp"]);
      const [doloresCompras, setDoloresCompras] = useState(["Compras de urgencia en obra sin validar presupuesto", "Control de herramienta y equipo con QR entre bodega y Silao"]);
      const [modoOfflineReq, setModoOfflineReq] = useState("Sí, indispensable modo sin señal en naves industriales / terracerías");
      const [volumenDatos, setVolumenDatos] = useState("Entre 500 GB y 2 TB");
      const [comentariosExtra, setComentariosExtra] = useState("");

      const [piramide, setPiramide] = useState([
        { id: 1, titulo: "Bóveda en la Nube, Carpetas Nestlé Silao y Respaldo Inmutable 3-2-1", desc: "Planos vigentes, contratos, fianzas y protección total anti-borrado/ransomware." },
        { id: 2, titulo: "Renovación de PCs, Licencias Oficiales y Respaldo de Equipos Locales", desc: "Puesta a punto de computadoras de oficina/AutoCAD y respaldo de información actual." },
        { id: 3, titulo: "Control de Compras, Requisiciones y Presupuesto en Tiempo Real", desc: "Autorización móvil de materiales antes de comprar y cruce contra estimaciones." },
        { id: 4, titulo: "Almacén, Inventario de Materiales y Herramienta con QR", desc: "Entradas, salidas y resguardos firmados digitalmente entre bodega central y Silao." },
        { id: 5, titulo: "App de Campo: Checador GPS (IMSS/DC-3), Bitácoras y Mantenimientos", desc: "Asistencia con foto/GPS en caseta, reportes fotográficos y firmas en pantalla." },
        { id: 6, titulo: "Tablero Ejecutivo del Director (Avance Junio 2027 y Flujo de Caja)", desc: "Indicadores financieros, semáforo físico vs. gastado y alertas en vivo." }
      ]);

      const triggerCloudSync = (newLogText, logType = "SYNC") => {
        setVaultFlash(true);
        setTimeout(() => setVaultFlash(false), 1200);
        setFeedLogs(prev => [{ time: "Justo ahora", type: logType, text: newLogText }, ...prev.slice(0, 7)]);
      };

      const handleMobileAction = (actionType) => {
        let logMsg = "";
        if (actionType === "ticket") {
          logMsg = `Orden firmada (${signedBy}) en ${selectedSite} -> PDF guardado en carpeta auditable y respaldo 3-2-1`;
          if (!offlineMode) setClosedTickets(c => c + 1);
        } else if (actionType === "bitacora") {
          logMsg = `Avance físico +2% reportado desde Planta Nestlé Purina Silao (Meta Junio 2027) con 4 fotos georreferenciadas`;
          if (!offlineMode) {
            setSilaoAdvance(a => Math.min(100, +(a + 2).toFixed(1)));
            setSilaoSpentPct(s => Math.min(100, +(s + 1.6).toFixed(1)));
          }
        } else if (actionType === "req") {
          const montoNum = Number(reqCost) || 45000;
          logMsg = `Nueva Requisición Silao: ${reqMaterial} ($${montoNum.toLocaleString("es-MX")} MXN) enviada a celular del Director`;
          if (!offlineMode) {
            setOpenReqs(prev => [
              { id: `REQ-${Math.floor(906 + Math.random() * 90)}`, obra: "Planta Nestlé Purina Silao", item: reqMaterial, monto: montoNum, solicitante: "Residente Silao", status: "Pendiente" },
              ...prev
            ]);
          }
        } else if (actionType === "checador") {
          logMsg = `Check-in GPS Silao + Resguardo QR (${qrTool}) registrado: ${workerCheck}`;
        }

        if (offlineMode) {
          setOfflineQueue(prev => [...prev, { actionType, logMsg }]);
        } else {
          triggerCloudSync(logMsg, actionType.toUpperCase());
        }
      };

      const reconnectAndSync = () => {
        setOfflineMode(false);
        if (offlineQueue.length > 0) {
          offlineQueue.forEach(item => {
            if (item.actionType === "ticket") setClosedTickets(c => c + 1);
            if (item.actionType === "bitacora") {
              setSilaoAdvance(a => Math.min(100, +(a + 2).toFixed(1)));
              setSilaoSpentPct(s => Math.min(100, +(s + 1.6).toFixed(1)));
            }
          });
          triggerCloudSync(`Sincronización Offline exitosa: ${offlineQueue.length} reportes retenidos en nave sin señal subidos a la nube`, "OFFLINE-SYNC");
          setOfflineQueue([]);
        }
      };

      const handleApproveReq = (id, decision) => {
        setOpenReqs(prev => prev.map(r => r.id === id ? { ...r, status: decision } : r));
        triggerCloudSync(`Requisición ${id} ${decision.toUpperCase()} por Dirección General desde móvil`, "FINANZAS");
      };

      const toggleMulti = (list, setList, value) => {
        if (list.includes(value)) {
          setList(list.filter(i => i !== value));
        } else {
          setList([...list, value]);
        }
      };

      const movePyramidItem = (index, dir) => {
        const target = index + dir;
        if (target < 0 || target >= piramide.length) return;
        const copy = [...piramide];
        const temp = copy[index];
        copy[index] = copy[target];
        copy[target] = temp;
        setPiramide(copy);
      };

      useEffect(() => {
        const onKey = (e) => {
          if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
          if (e.key === "1") setMainTab("dual");
          if (e.key === "2") setMainTab("director");
          if (e.key === "3") setMainTab("campo");
          if (e.key === "4") setMainTab("carpetas");
          if (e.key === "5") setMainTab("diagnostico");
          if (e.key.toLowerCase() === "r") handleMobileAction("bitacora");
          if (e.key.toLowerCase() === "b") setShowVaultModal(v => !v);
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [offlineMode]);

      const buildWhatsAppMessage = () => {
        const lines = [
          "*DIAGNÓSTICO EJECUTIVO CLOUD & TI — CASO PLANTA NESTLÉ PURINA SILAO*",
          empresaNombre ? `Empresa: ${empresaNombre}` : null,
          contactoNombre ? `Director / Contacto: ${contactoNombre}` : null,
          "",
          "*1. EQUIPO HUMANO Y ASISTENCIA*",
          `• Oficina: ${empOficina} | Residentes/Sup: ${empResidentes} | Campo/Cuadrillas: ${empCampo}`,
          `• Registro actual: ${checadorActual.join(", ") || "Por definir"}`,
          "",
          "*2. PARQUE DE CÓMPUTO, LICENCIAS Y RESPALDOS LOCALES*",
          `• Equipos: ${pcOficina} PCs Oficina | ${pcCad} Estaciones AutoCAD/BIM | ${pcPortatiles} Laptops/Tablets`,
          `• Acciones en equipos: ${accionComputo.join(", ") || "Por evaluar"}`,
          `• Licencias requeridas: ${licenciasReq.join(", ") || "Por evaluar"}`,
          `• Respaldo urgente en PCs: ${respaldosLocales.join(", ") || "Todo el disco"}`,
          `• Volumen estimado: ${volumenDatos}`,
          "",
          "*3. COMPRAS, ALMACÉN Y OPERACIÓN SILAO*",
          `• Prioridades en compras/bodega: ${doloresCompras.join(", ") || "Control integral"}`,
          `• Modo Offline en obra: ${modoOfflineReq}`,
          "",
          "*4. PIRÁMIDE DE PRIORIDADES (DEL #1 MÁS URGENTE AL #6)*",
          ...piramide.map((p, idx) => `${idx + 1}. ${p.titulo}`),
          comentariosExtra ? `\n*Observaciones del Director:* ${comentariosExtra}` : ""
        ].filter(Boolean).join("\n");
        return lines;
      };

      const sendToWhatsApp = () => {
        const text = encodeURIComponent(buildWhatsAppMessage());
        window.open(`https://wa.me/525585176347?text=${text}`, "_blank");
      };

      const copySummary = () => {
        navigator.clipboard.writeText(buildWhatsAppMessage());
        alert("Resumen copiado al portapapeles.");
      };

      const renderMobileSimulator = () => (
        <div className="bg-slate-900 text-white rounded-3xl p-4 sm:p-5 shadow-xl border border-slate-800">
          <div className="flex flex-wrap items-center justify-between gap-2 pb-3 mb-3 border-b border-slate-800">
            <div className="flex items-center gap-2">
              <span className={`w-2.5 h-2.5 rounded-full ${offlineMode ? "bg-amber-400 animate-pulse" : "bg-emerald-400"}`}></span>
              <div>
                <div className="text-xs font-bold tracking-wide">
                  {offlineMode ? `MODO SIN SEÑAL (NAVE INDUSTRIAL) · ${offlineQueue.length} EN COLA` : "CONECTADO 4G/5G · NUBE SILAO ACTIVA"}
                </div>
                <div className="text-[11px] text-slate-400 mono">GPS Puerto Interior, Silao · 20.9961° N, 101.4862° W</div>
              </div>
            </div>
            {offlineMode ? (
              <button onClick={reconnectAndSync} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500 hover:bg-emerald-400 text-slate-950 transition">
                Reconectar y Subir ({offlineQueue.length})
              </button>
            ) : (
              <button onClick={() => setOfflineMode(true)} className="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
                Simular Sin Señal
              </button>
            )}
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5 bg-slate-800/90 p-1 rounded-xl mb-4 text-xs font-medium">
            {[
              { id: "ticket", label: "1. Orden + Firma" },
              { id: "bitacora", label: "2. Avance Silao" },
              { id: "req", label: "3. Pedir Material" },
              { id: "checador", label: "4. Checador + QR" }
            ].map(t => (
              <button
                key={t.id}
                onClick={() => setMobileTab(t.id)}
                className={`py-2 px-2 rounded-lg transition text-center ${mobileTab === t.id ? "bg-white text-slate-900 font-semibold shadow" : "text-slate-300 hover:text-white"}`}
              >
                {t.label}
              </button>
            ))}
          </div>

          <div className="bg-white text-slate-900 rounded-2xl p-4 space-y-3.5">
            {mobileTab === "ticket" && (
              <>
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-bold uppercase px-2.5 py-1 rounded-md bg-blue-50 text-blue-700 mono">FOLIO #SIL-409 · EN SITIO</span>
                  <span className="text-xs font-semibold text-emerald-700">✓ Check-in GPS Silao OK</span>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Frente de Obra / Servicio Activo</label>
                  <select value={selectedSite} onChange={e => setSelectedSite(e.target.value)} className="w-full rounded-lg border border-slate-300 px-3 py-2 text-xs sm:text-sm font-medium bg-slate-50">
                    <option>Planta Nestlé Purina Silao · Cimentación Nave Principal</option>
                    <option>Planta Nestlé Purina Silao · Subestación Eléctrica 115kV</option>
                    <option>Planta Nestlé Purina Silao · Red Contra Incendio NFPA</option>
                    <option>Servicio Mantenimiento Externo · Póliza Industrial</option>
                  </select>
                </div>
                <div className="grid grid-cols-2 gap-2.5">
                  <div className="p-2.5 rounded-xl bg-slate-50 border border-slate-200">
                    <div className="text-[11px] font-bold text-slate-700">1. EVIDENCIA ANTES</div>
                    <div className="text-[11px] text-slate-500 mono truncate">Armado_Acero_Eje4.jpg</div>
                  </div>
                  <div className="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200">
                    <div className="text-[11px] font-bold text-emerald-800">2. LIBERACIÓN CALIDAD</div>
                    <div className="text-[11px] text-emerald-700 mono truncate">Colado_Nivel_OK.jpg</div>
                  </div>
                </div>
                <div className="border border-dashed border-slate-300 rounded-xl p-3 bg-slate-50/60">
                  <div className="flex justify-between items-center mb-1">
                    <span className="text-xs font-semibold text-slate-600">Firma Digital en Pantalla (Liberación / Cliente)</span>
                    <button onClick={() => setSignatureDone(!signatureDone)} className="text-[11px] text-blue-600 font-medium hover:underline">
                      {signatureDone ? "Limpiar trazo" : "Firmar"}
                    </button>
                  </div>
                  <div className="h-12 flex items-center justify-center">
                    {signatureDone ? (
                      <svg className="h-10 w-44 text-blue-900" viewBox="0 0 220 50" fill="none">
                        <path d="M12 36 C35 10, 55 42, 82 22 C105 8, 128 38, 156 18 C174 10, 192 28, 208 16" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round"/>
                      </svg>
                    ) : (
                      <span className="text-xs text-slate-400">Toque "Firmar" para capturar rúbrica</span>
                    )}
                  </div>
                  <input value={signedBy} onChange={e => setSignedBy(e.target.value)} className="w-full text-center text-[11px] bg-transparent border-t border-slate-200 pt-1 text-slate-600 mono" />
                </div>
                <button onClick={() => handleMobileAction("ticket")} className="w-full py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm shadow transition">
                  Cerrar Orden y Archivar PDF en Nube Silao
                </button>
              </>
            )}

            {mobileTab === "bitacora" && (
              <>
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-slate-700">LICITACIÓN NESTLÉ PURINA SILAO</span>
                  <span className="text-xs mono font-semibold px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded">Entrega: Junio 2027</span>
                </div>
                <div className="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                  <div className="flex justify-between text-xs">
                    <span className="text-slate-600">Avance Físico Acumulado:</span>
                    <span className="font-bold mono text-slate-900">{silaoAdvance}%</span>
                  </div>
                  <div className="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                    <div className="bg-blue-600 h-full transition-all duration-500" style={{ width: `${silaoAdvance}%` }}></div>
                  </div>
                  <div className="text-[11px] text-slate-500">Partida activa: Terracerías, Cimentación Profunda y Estructura Metálica Nave 1.</div>
                </div>
                <button onClick={() => handleMobileAction("bitacora")} className="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow transition">
                  Subir Bitácora Diaria (+2% Avance + Fotos GPS)
                </button>
              </>
            )}

            {mobileTab === "req" && (
              <>
                <div className="text-xs font-bold text-slate-700">SOLICITUD DE COMPRA / MATERIAL EN OBRA</div>
                <div>
                  <label className="block text-xs text-slate-600 mb-1">Material o Insumo Requerido</label>
                  <input value={reqMaterial} onChange={e => setReqMaterial(e.target.value)} className="w-full rounded-lg border border-slate-300 px-3 py-2 text-xs sm:text-sm" />
                </div>
                <div>
                  <label className="block text-xs text-slate-600 mb-1">Importe Estimado (MXN) · Cruza vs. Presupuesto Opus</label>
                  <input type="number" value={reqCost} onChange={e => setReqCost(e.target.value)} className="w-full rounded-lg border border-slate-300 px-3 py-2 text-xs sm:text-sm mono" />
                </div>
                <button onClick={() => handleMobileAction("req")} className="w-full py-2.5 px-4 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-semibold text-sm shadow transition">
                  Enviar Alerta de Aprobación al Director
                </button>
              </>
            )}

            {mobileTab === "checador" && (
              <>
                <div className="text-xs font-bold text-slate-700">CHECADOR BIOMÉTRICO GPS & BODEGA QR SILAO</div>
                <div>
                  <label className="block text-xs text-slate-600 mb-1">Cuadrilla / Personal en Caseta de Acceso</label>
                  <select value={workerCheck} onChange={e => setWorkerCheck(e.target.value)} className="w-full rounded-lg border border-slate-300 px-3 py-2 text-xs bg-slate-50">
                    <option>Cuadrilla Montaje Estructural (12 personas · SUA/DC-3 Vigente)</option>
                    <option>Cuadrilla Electromecánica (8 técnicos · Alturas DC-3 OK)</option>
                    <option>Residentes e Ingeniería de Campo Silao (6 personas)</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs text-slate-600 mb-1">Escaneo QR de Maquinaria / Herramienta Asignada</label>
                  <select value={qrTool} onChange={e => setQrTool(e.target.value)} className="w-full rounded-lg border border-slate-300 px-3 py-2 text-xs bg-slate-50 mono">
                    <option>Estación Total Leica TS07 #QR-019</option>
                    <option>Planta de Soldar Miller Bobcat 260 #QR-044</option>
                    <option>Lote 6 Rotomartillos SDS-Max #QR-108</option>
                  </select>
                </div>
                <button onClick={() => handleMobileAction("checador")} className="w-full py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm shadow transition">
                  Registrar Entrada GPS + Resguardo QR
                </button>
              </>
            )}
          </div>
        </div>
      );

      const renderDirectorDashboard = () => (
        <div className="space-y-4">
          <div className="grid grid-cols-2 xl:grid-cols-4 gap-3">
            <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
              <div className="text-[11px] font-semibold uppercase text-slate-500">Obra Insignia · Jun 2027</div>
              <div className="text-xl font-extrabold text-slate-900 mono mt-1">{silaoAdvance}% Físico</div>
              <div className="text-xs text-emerald-700 font-medium mt-1">Gasto ejercido: {silaoSpentPct}% (Sano)</div>
            </div>
            <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
              <div className="text-[11px] font-semibold uppercase text-slate-500">Órdenes / Reportes Firmados</div>
              <div className="text-xl font-extrabold text-blue-700 mono mt-1">{closedTickets} PDF</div>
              <div className="text-xs text-slate-500 mt-1">Listos para estimación/factura</div>
            </div>
            <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
              <div className="text-[11px] font-semibold uppercase text-slate-500">Compras por Autorizar</div>
              <div className="text-xl font-extrabold text-amber-600 mono mt-1">{openReqs.filter(r => r.status === "Pendiente").length} Activas</div>
              <div className="text-xs text-slate-500 mt-1">Control anti-sobrecosto</div>
            </div>
            <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
              <div className="text-[11px] font-semibold uppercase text-slate-500">Personal Activo Hoy (GPS)</div>
